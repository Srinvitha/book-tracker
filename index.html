<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">My Books</h1>

            <a href="add-book.html"
               class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                + Add Book
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-8">
        <div class="flex flex-col md:flex-row gap-4 mb-8">

            <input
                type="text"
                id="searchInput"
                placeholder="Search books..."
                class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            >

            <select
                id="typeFilter"
                class="px-4 py-3 border rounded-lg"
            >
                <option value="all">All Types</option>
                <option value="book">Book</option>
                <option value="manga">Manga</option>
                <option value="webnovel">Webnovel</option>
            </select>

            <select
                id="genreFilter"
                class="px-4 py-3 border rounded-lg"
            >
                <option value="all">All Genres</option>
            </select>

            <select
                id="statusFilter"
                class="px-4 py-3 border rounded-lg"
            >
                <option value="all">All Status</option>
                <option value="want">Want to Read</option>
                <option value="reading">Reading</option>
                <option value="completed">Completed</option>
                <option value="hiatus">Hiatus</option>
            </select>

            <select
                id="favoriteFilter"
                class="px-4 py-3 border rounded-lg"
            >
                <option value="all">All Books</option>
                <option value="favorites">Favorites</option>
            </select>

            <select
                id="sortBooks"
                class="px-4 py-3 border rounded-lg"
            >
                <option value="default">Order</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
            </select>

        </div>

        <div
            id="booksContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
        >
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
